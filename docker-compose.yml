services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ifood_ai_copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d ifood_ai_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: